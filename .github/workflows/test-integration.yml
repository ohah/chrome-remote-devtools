name: Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'tests/**'
      - '.github/workflows/test-integration.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'tests/**'
      - '.github/workflows/test-integration.yml'

jobs:
  check:
    name: Check if should run
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            integration:
              - 'packages/**'
              - 'tests/**'
              - '.github/workflows/test-integration.yml'

  integration-test:
    name: Integration Tests
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if no changes
        if: needs.check.outputs.should-run != 'true'
        run: echo "No integration test changes, skipping tests"
        continue-on-error: false

      - name: Setup Bun
        if: needs.check.outputs.should-run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        if: needs.check.outputs.should-run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        if: needs.check.outputs.should-run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        if: needs.check.outputs.should-run == 'true'
        run: bun install

      - name: Install Playwright browsers
        if: needs.check.outputs.should-run == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Build client package
        if: needs.check.outputs.should-run == 'true'
        run: cd packages/client && bun run build

      - name: Run integration tests
        if: needs.check.outputs.should-run == 'true'
        run: bun run test:e2e:integration
        continue-on-error: true
        id: test-run

      - name: Run inspector localStorage isolation test
        if: needs.check.outputs.should-run == 'true'
        run: bunx playwright test tests/e2e/inspector-localstorage-isolation.test.ts --project=chromium
        continue-on-error: true
        id: inspector-test-run

      - name: Check test results
        if: always() && needs.check.outputs.should-run == 'true'
        run: |
          if [ "${{ steps.test-run.outcome }}" != "success" ] || [ "${{ steps.inspector-test-run.outcome }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi

      - name: Publish Test Results
        if: always() && github.event_name == 'pull_request' && needs.check.outputs.should-run == 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit-results.xml
          check_name: Integration Tests
          comment_mode: always
          check_run: false
          report_individual_runs: true
          report_suite_logs: any

      - name: Upload test results
        if: always() && needs.check.outputs.should-run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure() && needs.check.outputs.should-run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/**/*.webm
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test screenshots
        if: always() && needs.check.outputs.should-run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/screenshots/*.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment test results on PR
        if: always() && github.event_name == 'pull_request' && needs.check.outputs.should-run == 'true'
        uses: actions/github-script@v7
        env:
          TEST_RUN_OUTCOME: ${{ steps.test-run.outcome }}
          INSPECTOR_TEST_RUN_OUTCOME: ${{ steps.inspector-test-run.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const runId = context.runId;
            const repo = context.repo;
            const artifactUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}`;

            // Check test results / 테스트 결과 확인
            const testRunOutcome = process.env.TEST_RUN_OUTCOME || 'success';
            const inspectorTestRunOutcome = process.env.INSPECTOR_TEST_RUN_OUTCOME || 'success';
            const hasTestFailure = testRunOutcome === 'failure' || inspectorTestRunOutcome === 'failure';

            // Find video files / 비디오 파일 찾기
            let videoFiles = [];
            try {
              const result = execSync('find test-results -name "*.webm" -type f 2>/dev/null || true', { encoding: 'utf-8' });
              videoFiles = result.trim().split('\n').filter(f => f.length > 0);
            } catch (error) {
              console.log('No video files found');
            }

            // Find screenshot files / 스크린샷 파일 찾기
            let screenshotFiles = [];
            try {
              const result = execSync('find test-results/screenshots -name "*.png" -type f 2>/dev/null || true', { encoding: 'utf-8' });
              screenshotFiles = result.trim().split('\n').filter(f => f.length > 0);
            } catch (error) {
              console.log('No screenshot files found');
            }

            // Always comment if there are test failures or artifacts / 테스트 실패 또는 아티팩트가 있으면 항상 댓글 작성
            if (screenshotFiles.length === 0 && videoFiles.length === 0 && !hasTestFailure) {
              console.log('No test artifacts or failures to comment');
              return;
            }

            // Create comment / 댓글 생성
            let comment = '## 📊 Test Results\n\n';

            // Add test status / 테스트 상태 추가
            if (hasTestFailure) {
              comment += '### ❌ Test Status: **FAILED**\n\n';
              if (testRunOutcome === 'failure') {
                comment += `- ❌ Integration tests failed\n`;
              }
              if (inspectorTestRunOutcome === 'failure') {
                comment += `- ❌ Inspector localStorage isolation test failed\n`;
              }
              comment += '\n';
            } else {
              comment += '### ✅ Test Status: **PASSED**\n\n';
            }

            // Add screenshots section / 스크린샷 섹션 추가
            if (screenshotFiles.length > 0) {
              comment += '### 📸 Screenshots\n\n';
              comment += `Screenshots are available as artifacts. [Download them here](${artifactUrl}).\n\n`;
              comment += `**Artifact name:** \`playwright-screenshots\`\n\n`;

              // List screenshot files / 스크린샷 파일 목록
              comment += '<details>\n<summary>Screenshot files</summary>\n\n';
              screenshotFiles.forEach((file, index) => {
                const fileName = path.basename(file);
                const clientId = fileName.replace('.png', '');
                comment += `${index + 1}. \`${fileName}\` (${clientId})\n`;
              });
              comment += '\n</details>\n\n';
            }

            // Add videos section / 비디오 섹션 추가
            if (videoFiles.length > 0) {
              comment += '### 🎥 Videos\n\n';
              comment += `Test videos are available as artifacts. [Download them here](${artifactUrl}).\n\n`;
              comment += `**Artifact name:** \`playwright-videos\`\n\n`;

              // List video files / 비디오 파일 목록
              comment += '<details>\n<summary>Video files</summary>\n\n';
              videoFiles.forEach((file, index) => {
                const fileName = path.basename(file);
                comment += `${index + 1}. \`${fileName}\`\n`;
              });
              comment += '\n</details>\n';
            }

            // Post comment to PR / PR에 댓글 작성
            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: context.issue.number,
            });

            // Find existing comment / 기존 댓글 찾기
            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('📊 Test Results')
            );

            if (botComment) {
              // Update existing comment / 기존 댓글 업데이트
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              // Create new comment / 새 댓글 생성
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

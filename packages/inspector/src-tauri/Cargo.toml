[package]
name = "inspector"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A Tauri App"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inspector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Tauri 의존성
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-clipboard-manager.workspace = true
# MCP Bridge for AI assistant (debug only) / AI 어시스턴트용 MCP Bridge (디버그 전용)
tauri-plugin-mcp-bridge = "0.8"
# HTTP client for Metro /json/list (avoids CORS in Tauri) / Metro /json/list 조회용 (Tauri에서 CORS 회피)
tauri-plugin-http = "2"

# 워크스페이스 공통 의존성
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true

# 서버 라이브러리 의존성 추가
chrome-remote-devtools-server = { path = "../../../crates/server" }
